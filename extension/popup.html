<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111b21;
    }
    .header {
      background: #008069;
      color: #fff;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff5252;
      flex-shrink: 0;
    }
    .header .dot.connected { background: #76ff03; }
    .content { padding: 16px; }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .stat .label { color: #667781; }
    .stat .value { font-weight: 500; }
    .strategy-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .strategy-badge.webpack { background: #d4edda; color: #155724; }
    .strategy-badge.dom { background: #fff3cd; color: #856404; }
    .strategy-badge.none { background: #f8d7da; color: #721c24; }
    .info-box {
      margin-top: 12px;
      padding: 10px;
      background: #fff8e1;
      border-radius: 8px;
      font-size: 12px;
      color: #5d4037;
      line-height: 1.5;
    }
    .status-msg { padding: 12px 0; font-size: 13px; color: #667781; text-align: center; }
    .status-msg.error { color: #ea4335; }
    .btn {
      width: 100%;
      padding: 10px;
      background: #008069;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn:hover { background: #006b58; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.secondary { background: #f0f2f5; color: #111b21; }
    .btn.secondary:hover { background: #e4e6eb; }
    .progress { font-size: 12px; color: #667781; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="status-dot"></div>
    <span>WhatsApp Mirror</span>
  </div>
  <div class="content">
    <div class="stat">
      <span class="label">Status</span>
      <span class="value" id="status-text">Waiting...</span>
    </div>
    <div class="stat">
      <span class="label">Strategy</span>
      <span class="value"><span class="strategy-badge none" id="strategy-badge">—</span></span>
    </div>
    <div class="stat">
      <span class="label">Chats found</span>
      <span class="value" id="chat-count">—</span>
    </div>
    <div class="stat">
      <span class="label">Last sync</span>
      <span class="value" id="last-sync">Never</span>
    </div>
    <div id="error-msg" class="status-msg error" style="display:none"></div>
    <div id="dom-info" class="info-box" style="display:none">
      <strong>DOM mode:</strong> Only visible messages are synced.
      For full chat history, use <em>Export Chat</em> from WhatsApp and import the .zip in the Search UI.
    </div>
    <div id="progress" class="progress" style="display:none"></div>
    <button class="btn" id="sync-btn">Sync Now</button>
    <button class="btn secondary" id="open-ui-btn">Open Search UI</button>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee;">
      <div style="font-size:11px;font-weight:600;color:#667781;margin-bottom:6px;">Search server (must match extension host permission)</div>
      <input type="text" id="server-url" placeholder="http://localhost:3000" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:12px;box-sizing:border-box;margin-bottom:8px;" />
      <div style="font-size:11px;font-weight:600;color:#667781;margin-bottom:6px;">Login required (JWT)</div>
      <input type="password" id="access-token" placeholder="Optional" autocomplete="off" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:12px;box-sizing:border-box;margin-bottom:8px;" />
      <button class="btn secondary" id="save-server-btn" type="button">Save server settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
