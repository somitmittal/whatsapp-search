# Render Blueprint — https://render.com/docs/blueprint-spec
# Use a Web Service (not Static Site). Set Root Directory if the app lives in a subfolder.
# Local Ollama does NOT run on Render (512 MB+ RAM required). Use cloud LLM keys below.
services:
  - type: web
    name: whatsapp-search
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Hosted control plane only — no GPT / WhatsApp UI on this service.
      - key: CONTROL_PLANE_ONLY
        value: "1"
      - key: OLLAMA_AUTO_START
        value: "false"
      # Set these as secrets in the Render dashboard:
      # - SESSION_SECRET (required)
      # - TURSO_DATABASE_URL + TURSO_AUTH_TOKEN (durable license DB)
      # - RESEND_API_KEY (magic-link email)
      # - STRIPE_* (optional billing)
