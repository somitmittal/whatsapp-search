name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.2) — created at current commit if missing'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: bash scripts/ci-install-pillow.sh
      - run: npm ci
      - run: bash scripts/generate-icon-icns.sh
      - run: bash scripts/prepare-node.sh darwin-arm64
      - run: bash scripts/rebuild-sqlite-for-node.sh build/node/bin/node
      - run: npx electron-builder --mac --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/*.dmg
          if-no-files-found: error

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: bash scripts/ci-install-pillow.sh
      - run: npm ci
      - run: bash scripts/generate-icon-icns.sh
      - run: bash scripts/prepare-node.sh darwin-x64
      - run: bash scripts/rebuild-sqlite-for-node.sh build/node/bin/node
      - run: npx electron-builder --mac --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: pip install pillow
      - run: npm ci
      - run: python scripts/generate-icon.py
      - shell: bash
        run: bash scripts/prepare-node.sh win-x64
      - shell: bash
        run: bash scripts/rebuild-sqlite-for-node.sh build/node/bin/node.exe
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: pip install pillow
      - run: npm ci
      - run: python3 scripts/generate-icon.py
      - run: bash scripts/prepare-node.sh linux-x64
      - run: bash scripts/rebuild-sqlite-for-node.sh build/node/bin/node
      - run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [build-mac-arm64, build-mac-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
