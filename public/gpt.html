<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>WhatsApp GPT</title>
  <link rel="stylesheet" href="/gpt-app/gpt.css">
</head>
<body>
<div class="gpt-app" id="gpt-app">
  <aside class="gpt-side" id="gpt-side">
    <div class="gpt-side-top">
      <button type="button" class="gpt-new" id="gpt-new">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <button type="button" class="gpt-icon" id="gpt-side-close" aria-label="Hide sidebar" title="Hide sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <input type="search" class="gpt-thread-filter" id="gpt-thread-filter" placeholder="Search threads" autocomplete="off">
    <nav class="gpt-threads" id="gpt-threads" aria-label="Conversations"></nav>
    <a class="gpt-side-link" href="/">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Open WhatsApp view
    </a>
  </aside>

  <main class="gpt-main">
    <header class="gpt-top">
      <button type="button" class="gpt-icon" id="gpt-side-open" aria-label="Show sidebar" title="Show sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <div class="gpt-title" id="gpt-title">WhatsApp GPT</div>
      <div class="gpt-model" id="gpt-model"></div>
    </header>

    <section class="gpt-scroll" id="gpt-scroll">
      <div class="gpt-thread" id="gpt-thread"></div>
      <div class="gpt-empty" id="gpt-empty">
        <h1>What do you want to know from your chats?</h1>
        <p>Type <kbd>@</kbd> to pin a chat or group as context. Answers cite the exact messages.</p>
        <div class="gpt-suggest" id="gpt-suggest"></div>
      </div>
    </section>

    <footer class="gpt-composer-wrap">
      <div class="gpt-composer" id="gpt-composer">
        <div class="gpt-pills" id="gpt-pills"></div>
        <div class="gpt-mention" id="gpt-mention" role="listbox" hidden></div>
        <textarea id="gpt-input" rows="1" placeholder="Ask anything about your WhatsApp…  (@ to add a chat)" autocomplete="off"></textarea>
        <div class="gpt-composer-row">
          <button type="button" class="gpt-at" id="gpt-at" title="Add chat context">@ Add context</button>
          <span class="gpt-hint">Enter to send · Shift+Enter for a new line</span>
          <button type="button" class="gpt-send" id="gpt-send" aria-label="Send" title="Send">
            <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </footer>
  </main>
</div>
<script src="/account-gate.js"></script>
<script type="module" src="/gpt-app/gpt.js"></script>
</body>
</html>
